<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superhero Academy - Student Registration Form</title>
    <style>
        @import url('https://googleapis.com');

        :root {
            --comic-yellow: #FFDE00;
            --comic-red: #F11A22;
            --comic-blue: #00A6F3;
            --comic-dark: #111111;
            --comic-white: #FFFFFF;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f0f0f0;
            /* Classic comic book halftone dot pattern */
            background-image: radial-gradient(var(--comic-blue) 15%, transparent 16%),
                              radial-gradient(var(--comic-blue) 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            margin: 0;
            padding: 20px;
            color: var(--comic-dark);
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background: var(--comic-white);
            border: 4px solid var(--comic-dark);
            box-shadow: 10px 10px 0px var(--comic-dark);
            padding: 30px;
            position: relative;
        }

        header {
            text-align: center;
            border-bottom: 4px dashed var(--comic-dark);
            padding-bottom: 20px;
            margin-bottom: 30px;
            background: var(--comic-yellow);
            padding: 15px;
            transform: rotate(-1deg);
            border: 4px solid var(--comic-dark);
            box-shadow: 5px 5px 0px var(--comic-dark);
        }

        h1 {
            font-family: 'Bangers', cursive;
            font-size: 3rem;
            letter-spacing: 2px;
            margin: 0;
            color: var(--comic-red);
            text-shadow: 2px 2px 0px var(--comic-dark);
            -webkit-text-stroke: 1px var(--comic-dark);
        }

        .exercise-meta {
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--comic-dark);
            margin-top: 5px;
        }

        fieldset {
            border: 3px solid var(--comic-dark);
            margin-bottom: 25px;
            padding: 20px;
            background: #fafafa;
            position: relative;
        }

        legend {
            font-family: 'Bangers', cursive;
            font-size: 1.5rem;
            background: var(--comic-red);
            color: var(--comic-white);
            padding: 5px 15px;
            border: 3px solid var(--comic-dark);
            transform: skew(-5deg);
            box-shadow: 3px 3px 0px var(--comic-dark);
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group.row {
            flex-direction: row;
            gap: 20px;
            flex-wrap: wrap;
        }

        .form-group.row > div {
            flex: 1;
            min-width: 200px;
        }

        label {
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: var(--comic-dark);
            display: inline-block;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="number"],
        select,
        textarea {
            padding: 10px;
            border: 2px solid var(--comic-dark);
            font-family: 'Open Sans', sans-serif;
            font-size: 1rem;
            background: var(--comic-white);
            box-shadow: 3px 3px 0px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--comic-blue);
            box-shadow: 4px 4px 0px var(--comic-dark);
            background: #fffdf3;
        }

        .radio-checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            padding-top: 5px;
        }

        .radio-checkbox-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            cursor: pointer;
            text-transform: none;
        }

        input[type="radio"], input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--comic-red);
            cursor: pointer;
        }

        input[type="color"] {
            border: 2px solid var(--comic-dark);
            width: 60px;
            height: 40px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        input[type="file"] {
            font-family: inherit;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--comic-blue);
        }

        .btn-container {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            font-family: 'Bangers', cursive;
            font-size: 1.8rem;
            padding: 10px;
            border: 4px solid var(--comic-dark);
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        button[type="submit"] {
            background: var(--comic-yellow);
            color: var(--comic-dark);
            box-shadow: 5px 5px 0px var(--comic-dark);
        }

        button[type="reset"] {
            background: #e0e0e0;
            color: var(--comic-dark);
            box-shadow: 5px 5px 0px var(--comic-dark);
        }

        button:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0px var(--comic-dark);
        }

        /* Comic Pop Art Accent */
        .pow-badge {
            position: absolute;
            top: -15px;
            right: -15px;
            background: var(--comic-yellow);
            color: var(--comic-dark);
            padding: 5px 10px;
            font-family: 'Bangers', cursive;
            font-size: 1.2rem;
            border: 3px solid var(--comic-dark);
            transform: rotate(15deg);
            box-shadow: 3px 3px 0px var(--comic-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Superhero Academy</h1>
            <div class="exercise-meta">Exercise No: 2 | Student Registration Form</div>
        </header>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <!-- SECTION 1: Text, Email, Password Fields -->
            <fieldset>
                <legend>Identity &amp; Credentials</legend>
                <div class="pow-badge">POW!</div>
                
                <div class="form-group row">
                    <div>
                        <!-- Text Field with required validation & autofocus -->
                        <label for="heroName">Hero / Alter-Ego Name:</label>
                        <input type="text" id="heroName" name="heroName" placeholder="e.g., Captain Justice" required autofocus>
                    </div>
                    <div>
                        <!-- Text Field with required validation -->
                        <label for="realName">Legal Real Name:</label>
                        <input type="text" id="realName" name="realName" placeholder="e.g., Clark Kent" required>
                    </div>
                </div>

                <div class="form-group row">
                    <div>
                        <!-- Email Field with built-in format matching -->
                        <label for="heroEmail">Secure Alliance Email:</label>
                        <input type="email" id="heroEmail" name="heroEmail" placeholder="name@avengers.com" required>
                    </div>
                    <div>
                        <!-- Password Field with minlength constraint -->
                        <label for="secretKey">Secret Access Key (Password):</label>
                        <input type="password" id="secretKey" name="secretKey" placeholder="Min 8 characters" minlength="8" required>
                    </div>
                </div>
            </fieldset>

            <!-- SECTION 2: Dates, Numbers, Selectors, Checks & Radios -->
            <fieldset>
                <legend>Hero Profile &amp; Origins</legend>
                
                <div class="form-group row">
                    <div>
                        <!-- Date Picker -->
                        <label for="originDate">Date of Power Manifestation:</label>
                        <input type="date" id="originDate" name="originDate" required>
                    </div>
                    <div>
                        <!-- Number Field with range boundaries -->
                        <label for="heroAge">Age (Years active):</label>
                        <input type="number" id="heroAge" name="heroAge" min="12" max="150" placeholder="12 - 150" required>
                    </div>
                </div>

                <div class="form-group row">
                    <div>
                        <!-- Radio Buttons -->
                        <label>Alignment Class:</label>
                        <div class="radio-checkbox-group">
                            <label class="radio-checkbox-label">
                                <input type="radio" name="alignment" value="hero" checked> Hero
                            </label>
                            <label class="radio-checkbox-label">
