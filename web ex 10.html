
<!DOCTYPE html>
<html>
<head>
    <title>Comic Book Registration</title>
    <style>
        body {
            background-color: #fff2a8;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #e63946;
            text-shadow: 2px 2px black;
        }

        form {
            background-color: #ffffff;
            border: 4px solid black;
            border-radius: 15px;
            width: 350px;
            margin: auto;
            padding: 20px;
            box-shadow: 6px 6px black;
        }

        input, select {
            padding: 8px;
            margin: 8px;
            border: 2px solid black;
            border-radius: 5px;
        }

        button {
            background-color: #ffcc00;
            padding: 10px 20px;
            border: 3px solid black;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff5733;
            color: white;
        }
    </style>
</head>

<body>

<h1>BOOM! COMIC HERO REGISTRATION</h1>
<h3>Register No: URK24CS1237</h3>

<form>
    <h2>JOIN THE HERO SQUAD!</h2>

    <label>Name:</label><br>
    <input type="text" placeholder="Enter your name" required><br>

    <label>Password:</label><br>
    <input type="password" placeholder="Enter password" required><br>

    <label>Age:</label><br>
    <input type="number" placeholder="Enter age"><br>

    <label>Mobile Number:</label><br>
    <input type="tel" placeholder="Mobile number" required><br>

    <label>Email:</label><br>
    <input type="email" placeholder="Enter email"><br>

    </select><br>

    <input type="checkbox"> C++

    <button type="submit">SUBMIT!</button>
</form>

</body>
</html>
