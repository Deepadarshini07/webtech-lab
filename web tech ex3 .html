<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comic Book Reading</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f2f2f2;
}

/* Header */
header{
    background:#444;
    color:white;
    text-align:center;
    padding:15px;
}

/* Navigation */
nav{
    background:#666;
}

nav ul{
    display:flex;
    justify-content:center;
    list-style:none;
}

nav li{
    padding:10px;
}

nav a{
    color:white;
    text-decoration:none;
}

/* Hero */
.hero{
    text-align:center;
    padding:20px;
    background:white;
}

/* Main */
.container{
    display:flex;
    padding:15px;
    gap:15px;
}

/* Sidebar */
.sidebar{
    width:30%;
    background:white;
    padding:15px;
}

.sidebar ul{
    list-style:none;
}

.sidebar li{
    padding:8px;
}

/* Content */
.content{
    width:70%;
    background:white;
    padding:15px;
}

/* Cards */
.cards{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.card{
    flex:1;
    border:1px solid gray;
    padding:10px;
    text-align:center;
}

.card img{
    width:100%;
    height:auto;
}

button{
    margin-top:10px;
    padding:8px 15px;
}

/* Footer */
footer{
    background:#444;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}

/* Tablet */
@media screen and (max-width:768px){

.container{
    flex-direction:column;
}

.sidebar,
.content{
    width:100%;
}

.cards{
    flex-wrap:wrap;
}

.card{
    width:45%;
}
}

/* Mobile */
@media screen and (max-width:480px){

nav ul{
    flex-direction:column;
}

.cards{
    flex-direction:column;
}

.card{
    width:100%;
}

button{
    width:100%;
}
}

</style>
</head>

<body>

<header>
<h1>Comic Book Reading</h1>
<p>Deepadarshini | URK24CS1237</p>
</header>

<nav>
<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Comics</a></li>
<li><a href="#">Genres</a></li>
<li><a href="#">Contact</a></li>
</ul>
</nav>

<div class="hero">
<h2>Welcome</h2>
<p>Read your favourite comic books.</p>
</div>

<div class="container">

<div class="sidebar">
<h3>Categories</h3>
<ul>
<li>Action</li>
<li>Adventure</li>
<li>Fantasy</li>
<li>Comedy</li>
</ul>
</div>

<div class="content">

<h2>Popular Comics</h2>

<div class="cards">

<div class="card">
<img src="https://picsum.photos/200/150?1">
<h3>Comic 1</h3>
<button>Read</button>
</div>

<div class="card">
<img src="https://picsum.photos/200/150?2">
<h3>Comic 2</h3>
<button>Read</button>
</div>

<div class="card">
<img src="https://picsum.photos/200/150?3">
<h3>Comic 3</h3>
<button>Read</button>
</div>

</div>

</div>

</div>

<footer>
<p>Prepared by Deepadarshini - URK24CS1237</p>
</footer>

</body>
</html>
